<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Auction Storage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 {
            color: #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px 5px;
        }
        button:hover {
            background: #45a049;
        }
        .danger {
            background: #f44336;
        }
        .danger:hover {
            background: #da190b;
        }
        .info {
            background: #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .success {
            background: #4CAF50;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>🧹 Clear Auction Storage</h1>
    <div class="info">
        <strong>What this does:</strong><br>
        Clears all auction-related time storage from sessionStorage and localStorage.<br>
        This ensures a fresh start when restarting the application.
    </div>

    <button onclick="clearTimeServiceStorage()">Clear Time Service Storage</button>
    <button onclick="clearAllStorage()" class="danger">Clear All Storage</button>

    <div id="result"></div>

    <script>
        const timeServiceKeys = [
            'timeService:lastTime',
            'timeService:lastTimeTimestamp',
            'timeService:blockchainOffset',
            'timeService:lastSyncTime',
            'timeService:lastBlockchainTime',
        ];

        function showResult(message, isSuccess = true) {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.className = isSuccess ? 'success' : 'info';
            result.textContent = message;
            setTimeout(() => {
                result.style.display = 'none';
            }, 3000);
        }

        function clearTimeServiceStorage() {
            try {
                let cleared = 0;
                timeServiceKeys.forEach(key => {
                    if (sessionStorage.getItem(key)) {
                        sessionStorage.removeItem(key);
                        cleared++;
                    }
                    if (localStorage.getItem(key)) {
                        localStorage.removeItem(key);
                        cleared++;
                    }
                });
                showResult(`✅ Cleared ${cleared} time service storage items`);
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, false);
            }
        }

        function clearAllStorage() {
            try {
                sessionStorage.clear();
                localStorage.clear();
                showResult('✅ All storage cleared (sessionStorage and localStorage)');
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, false);
            }
        }

        // Auto-clear on page load if running on localhost
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            console.log('🧹 Auto-clearing time service storage (localhost detected)');
            clearTimeServiceStorage();
        }
    </script>
</body>
</html>
